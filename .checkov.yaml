# Checkov configuration — IaC security scan for Bicep
framework:
  - bicep
directory:
  - infrastructure
soft-fail: true   # non-blocking while baseline is established; flip to false to enforce
output: cli
skip-check:
  # Each skip is a documented, deliberate exception (see README -> Security scope)
  - CKV_AZURE_42    # Key Vault recoverable: soft delete is enabled; checker needs purge protection too
  - CKV_AZURE_110   # Purge protection: breaks nightly dev teardown/redeploy (deterministic vault name)
  - CKV_AZURE_109   # Key Vault firewall rules: showcase vault; prod hardening = Private Endpoint
  - CKV_AZURE_189   # Key Vault public access: same as above
  - CKV_AZURE_206   # Storage replication: LRS deliberate for dev/test cost; prod uses GRS
  - CKV_AZURE_43    # Storage naming rule: false positive, name is lowercase alphanumeric <=24 chars
  - CKV_AZURE_216   # False positive: threatIntelMode=Deny is set on the Firewall Policy (firewall.bicep), not the firewall resource
