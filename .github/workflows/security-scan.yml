name: Security Scan (IaC)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (Bicep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  psrule:
    name: PSRule for Azure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run PSRule
        uses: microsoft/ps-rule@v2.9.0
        continue-on-error: true   # non-blocking baseline; remove to enforce
        with:
          modules: PSRule.Rules.Azure
          inputPath: infrastructure/
          outputFormat: Sarif
          outputPath: reports/ps-rule-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('reports/ps-rule-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/ps-rule-results.sarif
          category: psrule

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (C# sample app)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: csharp, build-mode: none }
      - uses: github/codeql-action/analyze@v3
